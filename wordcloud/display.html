<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>即時文字雲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #fbfaf7; --panel: #ffffff; --text: #1f2328; --muted: #6b6f76; --border: #e3e1da;
    --c1: #2f6fde; --c2: #d9480f; --c3: #1a7f4b; --c4: #9c36b5; --c5: #c2255c; --c6: #0b7285; --c7: #e67700;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --panel: #1b1e23; --text: #eceef1; --muted: #9aa0a8; --border: #2e3238;
      --c1: #74a3f7; --c2: #ff8a50; --c3: #4cc58a; --c4: #d084e8; --c5: #f06595; --c6: #3bc9db; --c7: #ffc048;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Noto Sans TC", system-ui, sans-serif;
    display: grid; grid-template-columns: 1fr 260px; grid-template-rows: auto 1fr;
    gap: 16px; padding: 16px;
  }
  header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: clamp(1.4rem, 3vw, 2.4rem); font-weight: 900; }
  .count { color: var(--muted); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  #stage { position: relative; min-height: 300px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 1.4rem; }

  /* 漂浮的詞：位置由 JS 用 transform 控制，字級變化用 transition 平滑 */
  .word {
    position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 900; line-height: 1.1;
    will-change: transform; user-select: none; pointer-events: none;
    transition: font-size .6s cubic-bezier(.2, .8, .2, 1);
  }
  .word > span { display: inline-block; animation: pop .7s cubic-bezier(.2, 1.6, .4, 1) both; }
  .word.bump > span { animation: bump .6s ease-out; }
  @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.35); filter: brightness(1.3); } 100% { transform: scale(1); } }

  aside { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; }
  #qr { background: #fff; padding: 10px; border-radius: 10px; }
  #qr img, #qr canvas { display: block; width: 200px; height: 200px; }
  .join { font-weight: 700; font-size: 1.1rem; margin: 0; }
  .room { color: var(--muted); margin: 0; font-size: .95rem; }
  ol { align-self: stretch; text-align: left; margin: 4px 0 0; padding-left: 1.6em; }
  ol li { padding: 2px 0; font-variant-numeric: tabular-nums; }
  ol li span { color: var(--muted); float: right; }
  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 60vh auto; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">即時文字雲</h1>
  <span class="count" id="count">0 則回應</span>
</header>
<section id="stage" aria-label="漂浮文字雲">
  <div id="empty">等待第一個關鍵字…</div>
</section>
<aside>
  <p class="join">掃描加入</p>
  <div id="qr"></div>
  <p class="room" id="room"></p>
  <ol id="top" aria-label="前五名"></ol>
</aside>

<script type="module">
  import { db } from "../firebase-config.js";
  import { collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

  const params = new URLSearchParams(location.search);
  const room = (params.get("room") || "demo").slice(0, 30);
  const topic = params.get("q");
  if (topic) { document.getElementById("title").textContent = topic; document.title = topic; }
  document.getElementById("room").textContent = `房間：${room}`;

  // 學生頁網址（帶同樣的 room 與題目）
  const joinUrl = new URL("./", location.href);
  joinUrl.searchParams.set("room", room);
  if (topic) joinUrl.searchParams.set("q", topic);
  new QRCode(document.getElementById("qr"), { text: joinUrl.href, width: 400, height: 400, correctLevel: QRCode.CorrectLevel.M });
  document.getElementById("qr").title = joinUrl.href;

  const stage = document.getElementById("stage");
  const empty = document.getElementById("empty");
  const countEl = document.getElementById("count");
  const topEl = document.getElementById("top");
  const COLORS = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6", "--c7"].map((v) => `var(${v})`);
  const MAX_WORDS = 120;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 大小寫、全形空白不同的同一個詞視為同一個
  const normalize = (w) => w.normalize("NFKC").replace(/\s+/g, " ").trim().toLowerCase();

  /** key -> { el, x, y, vx, vy, w, h, count } */
  const items = new Map();
  let colorIdx = 0;

  function fontSizeFor(count, maxCount, n) {
    const base = Math.min(stage.clientWidth, stage.clientHeight);
    // 詞越多，整體字級越小，避免擠滿畫面
    const crowd = Math.max(0.45, 1 - n / 160);
    const min = base / 20 * crowd;
    const max = base / 5.5 * crowd;
    return min + (max - min) * Math.sqrt(count / maxCount);
  }

  function randomVelocity() {
    const speed = (reduceMotion ? 8 : 35) + Math.random() * (reduceMotion ? 6 : 45);
    const a = Math.random() * Math.PI * 2;
    return [Math.cos(a) * speed, Math.sin(a) * speed];
  }

  function addItem(key, label, count) {
    const el = document.createElement("div");
    el.className = "word";
    el.style.color = COLORS[colorIdx++ % COLORS.length];
    const inner = document.createElement("span");
    inner.textContent = label;
    el.append(inner);
    stage.append(el);
    const [vx, vy] = randomVelocity();
    const item = { el, x: 0, y: 0, vx, vy, w: 0, h: 0, count, placed: false };
    items.set(key, item);
    return item;
  }

  function bump(item) {
    item.el.classList.remove("bump");
    void item.el.offsetWidth; // 重新觸發動畫
    item.el.classList.add("bump");
    // 被重複輸入時稍微加速，看起來更有活力
    item.vx *= 1.6; item.vy *= 1.6;
  }

  function sync(entries, total) {
    const list = [...entries].sort((a, b) => b[1].count - a[1].count).slice(0, MAX_WORDS);
    const keep = new Set(list.map(([k]) => k));
    const maxCount = list.length ? list[0][1].count : 1;

    for (const [key, item] of items) {
      if (!keep.has(key)) { item.el.remove(); items.delete(key); }
    }
    for (const [key, { label, count }] of list) {
      let item = items.get(key);
      if (!item) item = addItem(key, label, count);
      else if (count > item.count) bump(item);
      item.count = count;
      item.el.style.fontSize = `${fontSizeFor(count, maxCount, list.length).toFixed(1)}px`;
    }

    countEl.textContent = `${total} 則回應・${entries.size} 個詞`;
    empty.style.display = list.length ? "none" : "grid";
    topEl.replaceChildren(...list.slice(0, 5).map(([, { label, count }]) => {
      const li = document.createElement("li");
      li.textContent = label;
      const s = document.createElement("span");
      s.textContent = count;
      li.append(s);
      return li;
    }));
  }

  // 動畫迴圈：移動、撞牆反彈、詞與詞之間輕微互斥
  let last = performance.now();
  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const W = stage.clientWidth, H = stage.clientHeight;
    const arr = [...items.values()];

    for (const it of arr) {
      it.w = it.el.offsetWidth; it.h = it.el.offsetHeight;
      if (!it.placed) {
        it.x = Math.random() * Math.max(1, W - it.w);
        it.y = Math.random() * Math.max(1, H - it.h);
        it.placed = true;
      }
    }

    for (let i = 0; i < arr.length; i++) {
      for (let j = i + 1; j < arr.length; j++) {
        const a = arr[i], b = arr[j];
        const dx = (b.x + b.w / 2) - (a.x + a.w / 2);
        const dy = (b.y + b.h / 2) - (a.y + a.h / 2);
        const ox = (a.w + b.w) / 2 - Math.abs(dx);
        const oy = (a.h + b.h) / 2 - Math.abs(dy);
        if (ox > 0 && oy > 0) {
          // 重疊時沿重疊較少的方向互推，大字推得比較少
          const ma = a.w * a.h, mb = b.w * b.h, sum = ma + mb;
          const push = 60 * dt;
          if (ox < oy) {
            const s = Math.sign(dx) || 1;
            a.vx -= s * push * (mb / sum) * 4; b.vx += s * push * (ma / sum) * 4;
          } else {
            const s = Math.sign(dy) || 1;
            a.vy -= s * push * (mb / sum) * 4; b.vy += s * push * (ma / sum) * 4;
          }
        }
      }
    }

    const target = reduceMotion ? 12 : 55;
    for (const it of arr) {
      // 速度慢慢回到目標值，大字比較慢、小字比較快
      const sp = Math.hypot(it.vx, it.vy) || 1;
      const want = target * (1.2 - Math.min(0.7, it.h / H));
      const k = 1 + (want / sp - 1) * Math.min(1, dt * 1.5);
      it.vx *= k; it.vy *= k;

      it.x += it.vx * dt;
      it.y += it.vy * dt;
      if (it.x < 0) { it.x = 0; it.vx = Math.abs(it.vx); }
      if (it.y < 0) { it.y = 0; it.vy = Math.abs(it.vy); }
      if (it.x + it.w > W) { it.x = Math.max(0, W - it.w); it.vx = -Math.abs(it.vx); }
      if (it.y + it.h > H) { it.y = Math.max(0, H - it.h); it.vy = -Math.abs(it.vy); }
      it.el.style.transform = `translate(${it.x.toFixed(1)}px, ${it.y.toFixed(1)}px)`;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  let latest = { entries: new Map(), total: 0 };
  addEventListener("resize", () => sync(latest.entries, latest.total));

  const q = query(collection(db, "wordcloud_words"), where("room", "==", room));
  onSnapshot(q, (snap) => {
    const entries = new Map();
    snap.forEach((doc) => {
      const w = doc.data().word;
      if (typeof w !== "string") return;
      const key = normalize(w);
      if (!key) return;
      const e = entries.get(key);
      if (e) e.count++;
      else entries.set(key, { label: w.trim(), count: 1 });
    });
    latest = { entries, total: snap.size };
    sync(entries, snap.size);
  }, (err) => {
    console.error(err);
    empty.textContent = "無法連線到資料庫";
    empty.style.display = "grid";
  });
</script>
</body>
</html>
